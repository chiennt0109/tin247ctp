# Include this file inside the HTTPS `server` block serving tin247ctp.com.
# 260 MiB request = 256 MiB ZIP plus 4 MiB for multipart fields/headers.
# The application independently rejects ZIP files larger than 256 MiB.
client_max_body_size 260m;
client_body_timeout 300s;

# Importing and exporting a large test package can take longer than nginx's
# default proxy timeouts. These values only relax time, not size safeguards.
proxy_connect_timeout 30s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
